name: 编译 ImmortalWrt 23.05.7

on:
  workflow_dispatch:
    inputs:
      target:
        description: 选择固件目标
        required: true
        default: all
        type: choice
        options:
          - all
          - r619ac
          - x86
          - x86_64
      ssh:
        description: 编译前启用仅发起者可访问的 SSH 调试
        required: false
        default: false
        type: boolean
      upload_release:
        description: 同时发布到 GitHub Release 并更新 README 下载链接
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

concurrency:
  group: immortalwrt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 编译 ${{ matrix.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'all' && '["r619ac","x86","x86_64"]' || format('["{0}"]', inputs.target)) }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 恢复构建脚本执行权限
        run: |
          find . -path './.git' -prune -o -type f -print0 | while IFS= read -r -d '' script; do
            if head -n 1 "$script" | grep -q '^#!'; then
              chmod +x "$script"
            fi
          done

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man intltool libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
            libyaml-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip-full \
            patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip wget xmlto xxd zlib1g-dev

      - name: 恢复源码符号链接
        run: bash scripts/custom/restore-symlinks.sh

      - name: 缓存下载和编译缓存
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: immortalwrt-23.05.7-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/**', 'scripts/custom/**') }}
          restore-keys: |
            immortalwrt-23.05.7-${{ matrix.target }}-

      - name: 更新并安装官方 Feeds
        run: |
          perl ./scripts/feeds update -a
          rm -rf feeds/packages/lang/golang
          git clone --depth 1 --single-branch --branch 26.x https://github.com/sbwml/packages_lang_golang.git feeds/packages/lang/golang
          perl ./scripts/feeds install -a

      - name: 同步第三方源码
        run: bash scripts/custom/prepare-packages.sh

      - name: 应用源码级定制
        run: bash scripts/custom/configure-source.sh

      - name: 检查重复软件包定义
        run: bash scripts/custom/check-package-conflicts.sh

      - name: 生成并验证目标配置
        run: |
          bash scripts/custom/select-config.sh "${{ matrix.target }}"
          bash scripts/custom/verify-config.sh "${{ matrix.target }}"
          bash scripts/custom/verify-openvpn-server.sh

      - name: SSH 调试
        if: ${{ inputs.ssh }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: 下载软件包源码
        run: make download -j8

      - name: 编译固件
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: 验证 R619AC 刷机镜像
        if: ${{ matrix.target == 'r619ac' }}
        run: bash scripts/custom/verify-r619ac-images.sh

      - name: 整理构建信息
        if: ${{ success() }}
        run: |
          if [ ! -f .config ]; then
            echo "未生成 .config，跳过构建信息整理。"
            exit 0
          fi
          mkdir -p "artifacts/${{ matrix.target }}"
          cp .config "artifacts/${{ matrix.target }}/config.buildinfo"
          cp scripts/custom/package-sources.sh "artifacts/${{ matrix.target }}/package-sources.sh"
          if [ -d bin/targets ]; then
            cp -a bin/targets/. "artifacts/${{ matrix.target }}/"
          fi

      - name: 上传构建产物
        if: ${{ success() && hashFiles('artifacts/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-23.05.7-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}
          include-hidden-files: true
          if-no-files-found: error

  release:
    name: 发布固件
    if: ${{ inputs.upload_release }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理 Release 文件
        run: |
          mkdir -p release-assets
          find artifacts -type f -path '*/bin/targets/*' -print0 | while IFS= read -r -d '' file; do
            artifact_dir="$(printf '%s' "$file" | sed 's#^artifacts/##; s#/.*##')"
            target="${artifact_dir#immortalwrt-23.05.7-}"
            name="$(basename "$file")"
            if [ "$target" = "x86" ] || [ "$target" = "x86_64" ]; then
              case "$name" in
                *squashfs-combined.img|*squashfs-combined.img.gz|*squashfs-combined-efi.img.gz|sha256sums|version.buildinfo|*.version.buildinfo)
                  cp "$file" "release-assets/${target}-${name}"
                  ;;
              esac
            elif [ "$target" = "r619ac" ]; then
              case "$name" in
                *factory.ubi|*sysupgrade.bin|sha256sums|version.buildinfo|*.version.buildinfo)
                  cp "$file" "release-assets/${target}-${name}"
                  ;;
              esac
            else
              case "$name" in
                *.bin|*.img|*.img.gz|*.itb|*.trx|*.ubi|*.squashfs*|*.tar.gz|*.vdi|*.vmdk|*.qcow2|sha256sums|*.manifest|*.json)
                  cp "$file" "release-assets/${target}-${name}"
                  ;;
              esac
            fi
          done
          test -n "$(find release-assets -type f -print -quit)"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: immortalwrt-v23.05.7-${{ github.run_number }}
          name: ImmortalWrt v23.05.7 build ${{ github.run_number }}
          generate_release_notes: true
          files: release-assets/*

      - name: 更新 README 固件下载链接
        env:
          RELEASE_TAG: immortalwrt-v23.05.7-${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import quote

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          start = "<!-- FIRMWARE_RELEASES_START -->"
          end = "<!-- FIRMWARE_RELEASES_END -->"
          repository = os.environ["REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          targets = {"r619ac": "R619AC", "x86": "X86", "x86_64": "X86_64"}
          suffixes = (".bin", ".img", ".img.gz", ".itb", ".trx", ".ubi", ".tar.gz", ".vdi", ".vmdk", ".qcow2")

          def is_firmware(name):
              return name.endswith(suffixes) or ".squashfs" in name

          links = []
          for path in sorted(Path("release-assets").iterdir()):
              if not path.is_file() or not is_firmware(path.name):
                  continue
              target = next((key for key in targets if path.name.startswith(key + "-")), "")
              if not target:
                  continue
              url = f"https://github.com/{repository}/releases/download/{tag}/{quote(path.name)}"
              links.append((target, path.name, url))

          lines = [
              start,
              f"### ImmortalWrt v23.05.7 构建 {tag.rsplit('-', 1)[-1]}",
              "",
          ]
          for target in targets:
              target_links = [(name, url) for key, name, url in links if key == target]
              if not target_links:
                  continue
              lines.append(f"- **{targets[target]}**")
              lines.extend(f"  - [{name}]({url})" for name, url in target_links)
          if not links:
              lines.append("- 暂无可下载固件。")
          lines.extend([end, ""])
          block = "\n".join(lines)
          pattern = re.compile(re.escape(start) + r".*?" + re.escape(end), re.S)
          if pattern.search(text):
              text = pattern.sub(block.rstrip(), text, count=1)
          else:
              marker = "Default login address: http://192.168.50.1, username: __root__, password: __password__."
              text = text.replace(marker, marker + "\n\n" + block.rstrip(), 1)
          readme.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "更新固件 Release 下载链接"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi